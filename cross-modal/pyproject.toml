[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rgbd-cross-modal-compensation"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
test = ["einops>=0.6"]
geometry = ["numpy>=1.24", "timm>=1.0.15"]
keypoints = ["numpy>=1.24", "timm>=1.0.15", "Pillow>=10", "matplotlib>=3.8", "psutil>=5.9"]
figures = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["models*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
